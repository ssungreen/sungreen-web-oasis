name = "sungreen-web-oasis"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "sungreen-db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" # Placeholder: Replace with actual ID from Cloudflare Dashboard

# R2 Storage Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sungreen-cases"
preview_bucket_name = "sungreen-cases-preview"

[vars]
# Environment variables for the frontend/functions
ENVIRONMENT = "production"
